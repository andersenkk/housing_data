<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Housing Market Dashboard</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js" defer></script>
    <script src="dashboard-map.js" defer></script>
</head>
<body class="dashboard-page">
    <header class="dashboard-header">
        <a class="dashboard-brand" href="dashboard.html">Housing Data</a>
        <a class="dashboard-exit" href="index.html">Log out</a>
    </header>

    <main class="dashboard-main">
        <section class="dashboard-title-row" aria-labelledby="dashboard-title">
            <div>
                <p class="dashboard-eyebrow">MARKET OVERVIEW</p>
                <h1 id="dashboard-title">Explore affordability metrics across the U.S.</h1>
            </div>
        </section>

        <section class="map-section" aria-label="U.S. housing map">
            <div class="filter-toolbar" aria-label="Dashboard filters">
                <div class="filter-control">
                    <label for="metric-filter">Metric</label>
                    <select id="metric-filter" class="filter-select" disabled>
                        <option>Loading...</option>
                    </select>
                </div>
                <div class="filter-control">
                    <label for="year-filter">Year</label>
                    <select id="year-filter" class="filter-select" disabled>
                        <option>Loading...</option>
                    </select>
                </div>
                <div class="filter-control">
                    <label for="month-filter">Month</label>
                    <select id="month-filter" class="filter-select" disabled>
                        <option>Loading...</option>
                    </select>
                </div>
                <div class="filter-control state-filter-control">
                    <span class="filter-control-label">State</span>
                    <details class="state-picker" id="state-filter">
                        <summary>Loading states...</summary>
                        <div class="state-picker-menu">
                            <div class="state-picker-actions">
                                <button type="button" id="select-all-states">Select all</button>
                                <button type="button" id="clear-states">Clear</button>
                            </div>
                            <div class="state-picker-list" id="state-filter-list"></div>
                        </div>
                    </details>
                </div>
                <div class="filter-placeholder" aria-label="Filter 5 placeholder">Filter 5</div>
                <div class="filter-placeholder" aria-label="Filter 6 placeholder">Filter 6</div>
                <p class="filter-status" id="filter-status" role="status" aria-live="polite"></p>
            </div>

            <div class="playback-toolbar" aria-label="Year playback controls">
                <button class="playback-button" id="playback-toggle" type="button" aria-pressed="false" disabled>
                    <span class="playback-icon" aria-hidden="true">&#9654;</span>
                    <span class="playback-button-label">Play</span>
                </button>
                <div class="playback-range">
                    <label for="start-year">Start
                        <select id="start-year" class="filter-select" disabled>
                            <option>Loading...</option>
                        </select>
                    </label>
                    <label for="end-year">Finish
                        <select id="end-year" class="filter-select" disabled>
                            <option>Loading...</option>
                        </select>
                    </label>
                </div>
                <div class="playback-current" aria-live="polite">
                    <span class="playback-current-label">SHOWING</span>
                    <output id="playback-year">—</output>
                </div>
                <div class="map-legend" aria-label="Map color scale: lower values green, higher values red">
                    <span class="legend-heading">VALUE SCALE</span>
                    <div class="legend-scale">
                        <span id="legend-min">Lower</span>
                        <span class="legend-gradient" aria-hidden="true"></span>
                        <span id="legend-max">Higher</span>
                    </div>
                </div>
            </div>

            <div class="map-heading">
                <h2>United States</h2>
                <p>Hover over a state to see more information</p>
            </div>
            <div class="us-map-wrap" id="us-map" aria-live="polite">
                <p class="map-status">Loading state map...</p>
            </div>
        </section>
    </main>
</body>
</html>
