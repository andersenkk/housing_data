<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body class="create-account-page">
    <nav class="landing-top-nav">
        <a href="index.html">Back to Login</a>
    </nav>
    <main class="container">
        <div class="login-card">
            <header>
                <h1>Create Your Account</h1>
            </header>

            <p class="form-message" data-form-message role="status" aria-live="polite"></p>

            <form class="login-form" data-register-form>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" placeholder="Create your password" required>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirmPassword" autocomplete="new-password" minlength="8" placeholder="Confirm password" required>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>

        </div>
    </main>

</body>
</html>
