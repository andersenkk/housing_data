<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>

    <main class="container">
        <div class="login-card">
            <header class="card-header">
                <h1>Real Estate Data</h1>
                <p class="subtitle">Sign in to continue</p>
            </header>

            <p class="form-message" data-form-message role="status" aria-live="polite"></p>

            <form class="login-form" data-login-form>
                <div class="input-group">
                    <label for="email">Email or Username</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="submit-btn">Log In</button>
            </form>

            <footer class="card-footer">
                <span>Need an account? <a href="create_account.html">Create one</a></span>
            </footer>
        </div>
    </main>

</body>
</html>
